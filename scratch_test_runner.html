<!DOCTYPE html>
<html>
<head>
<script>
window.logs = [];
window.errors = [];
window.onerror = function(msg, url, line, col, err) {
  window.errors.push({ msg, url, line, col, err: err ? err.stack : null });
};
console.error = function(...args) {
  window.errors.push({ console_error: args.map(String).join(' ') });
};
console.warn = function(...args) {
  window.logs.push({ warn: args.map(String).join(' ') });
};
console.log = function(...args) {
  window.logs.push({ log: args.map(String).join(' ') });
};
</script>
</head>
<body>
<iframe src="http://localhost:8888/index.html" id="testframe" style="width:800px;height:600px;"></iframe>
<script>
setTimeout(() => {
  const iframe = document.getElementById('testframe');
  const win = iframe.contentWindow;
  const doc = iframe.contentDocument;
  
  const result = {
    mapElement: !!doc.getElementById('map'),
    mapInstance: !!win.map,
    userMarker: !!win.userMarker,
    leafletDefined: typeof win.L !== 'undefined',
    errors: window.errors,
    frameErrors: win._testErrors || [],
    cities: !!win.BOLIVIA_CITIES,
    mapTileLayers: Object.keys(win.mapTileLayers || {})
  };
  
  const pre = document.createElement('pre');
  pre.id = "result";
  pre.textContent = JSON.stringify(result, null, 2);
  document.body.appendChild(pre);
}, 3000);
</script>
</body>
</html>
