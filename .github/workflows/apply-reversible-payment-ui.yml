name: Apply reversible payment UI policy

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-reversible-payment-ui.yml'

permissions:
  contents: write

jobs:
  apply-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply reversible payment UI policy
        run: python3 scripts/apply_reversible_payment_ui.py

      - name: Validate changes
        run: |
          git diff --check
          node scripts/check_syntax.js
          node scripts/check_runtime.js
          node scripts/check_audit_hardening.js
          node scripts/test_driver_plans.js
          python3 test_financial_parameters.py

      - name: Commit reversible payment policy
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/admin_payments.js sw.js scripts/check_audit_hardening.js test_financial_parameters.py
          git commit -m "fix: reactivar repartidor al verificarse el pago total"
          git push origin HEAD:main
