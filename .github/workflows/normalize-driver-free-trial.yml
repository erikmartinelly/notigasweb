name: One-off normalize driver free trial

# Retry after tightening source assertions.
on:
  push:
    branches: [ fix/driver-free-trial-registration ]
    paths:
      - '.github/workflows/normalize-driver-free-trial.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/driver-free-trial-registration
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Normalize registration source
        run: node scripts/normalize_driver_free_trial.js

      - name: Verify normalized source
        run: node scripts/normalize_driver_free_trial.js --check

      - name: Verify diff integrity
        run: git diff --check

      - name: Commit normalized source
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: dejar una sola prueba gratis para repartidores'
          git push origin HEAD:fix/driver-free-trial-registration
