name: One-time prune obsolete branches

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  prune:
    if: contains(github.event.head_commit.message, '[prune-branches]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Delete verified obsolete remote branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "audit/second-pass-20260913"
            "audit/second-pass-current-main"
            "fix/audit-hardening-20260910"
            "fix/driver-50free-progressive-credit"
            "fix/driver-free-trial-registration"
            "fix/driver-registration-minimal"
            "fix/final-auth-policy-hardening-20260912"
            "fix/move-driver-credit-copy-to-terms"
            "fix/order-privacy-50m"
            "fix/preprod-audit-reconciliation"
            "fix/preprod-final-audit-20260910"
            "fix/preprod-final-audit-20260911"
            "fix/preprod-migration-reconcile-20260911"
            "fix/production-readiness-20260912"
            "fix/recheck-production-20260913"
            "fix/reproducible-migrations-20260913"
            "fix/security-hardening-20260912"
            "fix/yape-remesas-admin-reconcile"
            "fix/yape-remesas-bolivia"
            "perf/defer-device-security"
            "perf/defer-parser-blocking-assets"
            "perf/remove-dead-client-purge"
            "perf/slow-page-audit"
            "chore/prune-obsolete-branches"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting origin/$branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: origin/$branch"
            fi
          done

          echo "Remaining remote heads:"
          git ls-remote --heads origin
