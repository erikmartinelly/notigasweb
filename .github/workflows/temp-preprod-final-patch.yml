name: TEMP - Preprod final patch

on:
  push:
    branches: [ fix/preprod-final-audit-20260911 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preprod-final-audit-20260911
          fetch-depth: 0
      - name: Patch secure driver-order delegation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/orders.js')
          s = p.read_text(encoding='utf-8')
          marker = 'async function renderDriverOrdersList() {\n'
          guard = """async function renderDriverOrdersList() {\n  // La lista legacy nunca debe consultar pedidos libres completos. Primero carga\n  // y delega a la capa de privacidad, que consume order_public_radar.\n  if (typeof window.secureRenderDriverOrdersList === 'function') {\n    return window.secureRenderDriverOrdersList();\n  }\n  if (typeof window.loadDriverPaymentsModule === 'function') {\n    try {\n      await window.loadDriverPaymentsModule();\n      if (typeof window.secureRenderDriverOrdersList === 'function') {\n        return window.secureRenderDriverOrdersList();\n      }\n    } catch (err) {\n      console.warn('[Orders] No se pudo cargar la capa segura de pedidos:', err);\n    }\n  }\n"""
          if '[Orders] No se pudo cargar la capa segura de pedidos:' not in s:
              if marker not in s:
                  raise SystemExit('No se encontró renderDriverOrdersList')
              s = s.replace(marker, guard, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate secure delegation
        run: |
          node --check js/orders.js
          grep -q "secureRenderDriverOrdersList" js/orders.js
          grep -q "suspendido_mora" js/orders.js
          grep -q "suspendido_pago" js/orders.js
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'notigas-ci'
          git config user.email 'notigas-ci@users.noreply.github.com'
          git add js/orders.js
          git commit -m 'fix: delegar pedidos libres al radar seguro'
          git push origin HEAD:fix/preprod-final-audit-20260911
