name: CI - Syntax & Integrity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Smoke test HTTP server
        run: |
          node server.js > /tmp/notigas-server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/health | grep -q '^OK$'; then
              curl -fsS http://127.0.0.1:3000/ > /tmp/notigas-index.html
              curl -fsS 'http://127.0.0.1:3000/js/app.js?v=135' > /tmp/notigas-app.js
              curl -fsS 'http://127.0.0.1:3000/js/driver_order_rules.js?v=135' > /tmp/notigas-driver-rules.js
              grep -q '🌍 Todos' /tmp/notigas-index.html
              grep -q '<script defer src="js/driver_icons.js?v=135"></script>' /tmp/notigas-index.html
              grep -q '<script defer src="js/device_security.js?v=135"></script>' /tmp/notigas-index.html
              grep -q 'id="driverCreditProgressiveTerms"' /tmp/notigas-index.html
              grep -q 'El primer ciclo cobrable permite <strong>100 pedidos = S/ 20</strong>' /tmp/notigas-index.html
              grep -q '🎁 PRUEBA GRATIS' /tmp/notigas-index.html
              grep -q 'Los primeros 50 pedidos son gratis. Desde el pedido 51 en adelante se cobra <strong>S/ 0,20 por pedido</strong>.' /tmp/notigas-index.html
              grep -q 'Color Camión o camioneta' /tmp/notigas-index.html
              grep -q 'id="inputDriverTruckColor"' /tmp/notigas-index.html
              if grep -q 'Color de tu Camión Toyota Dina' /tmp/notigas-index.html; then
                echo 'La ficha de repartidor volvió a mostrar Toyota Dina en el selector de color'
                exit 1
              fi
              if grep -q 'driverTruckPreviewContainer' /tmp/notigas-index.html; then
                echo 'La ficha de repartidor volvió a mostrar la vista previa pesada del camión'
                exit 1
              fi
              if grep -Eq 'Elige tu Modalidad de Registro|Plan Gratuito|Pedidos con <strong>3 min de espera</strong>|Ficha básica sin corona VIP' /tmp/notigas-index.html; then
                echo 'La ficha de repartidor volvió a mostrar el selector de planes heredado'
                exit 1
              fi
              if grep -q 'El primer ciclo cobrable permite <strong>100 pedidos = S/ 20</strong>' /tmp/notigas-driver-rules.js; then
                echo 'El detalle de crédito todavía aparece en el formulario de registro de repartidores'
                exit 1
              fi
              if grep -q '<script src="js/driver_icons.js?v=135"></script>' /tmp/notigas-index.html; then
                echo 'driver_icons.js todavía bloquea el parser'
                exit 1
              fi
              if grep -q '<script src="js/device_security.js?v=135"></script>' /tmp/notigas-index.html; then
                echo 'device_security.js todavía bloquea el parser'
                exit 1
              fi
              if grep -q "rpc_purge_old_records" /tmp/notigas-app.js; then
                echo 'app.js servido todavía intenta ejecutar la purga interna desde el navegador'
                exit 1
              fi
              grep -q 'purga de retención se ejecuta exclusivamente en servidor mediante pg_cron' /tmp/notigas-app.js
              node -e "const fs=require('fs');const s=fs.readFileSync('/tmp/notigas-index.html','utf8');if(s.includes(String.fromCharCode(0x90))){console.error('HTML servido contiene control U+0090');process.exit(1)}"
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/notigas-server.log
          exit 1

      - name: Verify JavaScript Syntax
        run: node scripts/check_syntax.js

      - name: Verify Runtime & Map Initialization
        run: node scripts/check_runtime.js

      - name: Verify Cross-Role View Contract
        run: node scripts/test_rls_security.js

      - name: Verify Audit Hardening Invariants
        run: node scripts/check_audit_hardening.js

      - name: Verify Driver Free Trial Registration
        run: node scripts/normalize_driver_free_trial.js --check

      - name: Verify Yape Remesas Contract
        run: node scripts/check_yape_remittance_contract.js

      - name: Verify Order Privacy Contract
        run: node scripts/check_order_privacy.js

      - name: Verify Final Preproduction Guardrails
        run: node scripts/check_preprod_final.js

      - name: Verify Driver Promotion and Credit Tiers
        run: node scripts/test_driver_plans.js

      - name: Verify Financial Contract
        run: python3 test_financial_parameters.py

      - name: Verify Live Supabase Public Boundary
        run: node scripts/test_db_integration.js
