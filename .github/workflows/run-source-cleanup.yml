name: Run source cleanup

on: [push]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean legacy finance sources
        run: python3 scripts/cleanup_legacy_finance_sources.py
      - name: Validate
        run: |
          git diff --check
          node scripts/check_syntax.js
          node scripts/check_runtime.js
          node scripts/check_audit_hardening.js
          python3 test_financial_parameters.py
      - name: Commit source cleanup
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/orders.js
          git commit -m "fix: remove legacy finance source residues"
          git push origin HEAD:main
