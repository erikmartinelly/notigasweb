name: TEMP - Align privacy migration history

on:
  push:
    branches: [ fix/order-privacy-50m ]

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/order-privacy-50m
          fetch-depth: 0
      - name: Align exact Supabase migration timestamp
        run: |
          set -euo pipefail
          OLD='supabase/migrations/20260911022500_secure_order_radar_and_registered_driver_visibility.sql'
          NEW='supabase/migrations/20260911022526_secure_order_radar_and_registered_driver_visibility.sql'
          if [ -f "$OLD" ]; then git mv "$OLD" "$NEW"; fi
          sed -i 's/20260911022500_secure_order_radar_and_registered_driver_visibility/20260911022526_secure_order_radar_and_registered_driver_visibility/g' scripts/check_order_privacy.js scripts/check_audit_hardening.js
          sed -i "s/!\['134','135'\]\.includes(uniqueHtmlVersions\[0\])/uniqueHtmlVersions[0] !== '135'/" scripts/check_audit_hardening.js || true
      - name: Validate privacy contract
        run: |
          node scripts/check_syntax.js
          node scripts/check_order_privacy.js
          node scripts/check_audit_hardening.js
      - name: Commit alignment when needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'notigas-ci'
          git config user.email 'notigas-ci@users.noreply.github.com'
          git add supabase/migrations scripts/check_order_privacy.js scripts/check_audit_hardening.js
          git commit -m 'chore: alinear migración de privacidad con Supabase'
          git push origin HEAD:fix/order-privacy-50m
