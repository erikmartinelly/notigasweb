name: Preprod Final Autofix

on:
  push:
    branches: [ fix/preprod-final-audit-20260910 ]

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[preprod-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/preprod-final-audit-20260910
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply preproduction fixes
        run: node scripts/apply_preprod_final_fixes.js

      - name: Validate syntax and invariants
        run: |
          node scripts/check_syntax.js
          node scripts/check_runtime.js
          node scripts/check_audit_hardening.js
          node scripts/test_driver_plans.js
          python3 test_financial_parameters.py

      - name: Commit transformed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: cierre integral preproducción [preprod-autofix]"
          git push origin HEAD:fix/preprod-final-audit-20260910
