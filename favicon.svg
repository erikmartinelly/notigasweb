<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fondo Redondeado Dark Glassmorphism -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#FF6D00" stroke-width="12"/>
  
  <!-- Círculo Radiante Naranja de Garrafa -->
  <circle cx="256" cy="256" r="210" fill="url(#orangeGrad)" opacity="0.15" />
  
  <!-- Cabina y Carrocería del Camión Garrafero de Gas GLP -->
  <g fill="url(#orangeGrad)" filter="url(#glow)">
    <!-- Cuerpo del Camión -->
    <path d="M64 160h220v140H64z" rx="12"/>
    <!-- Cabina -->
    <path d="M284 190h80l44 50v60H284z"/>
    <!-- Garrafa de Gas GLP sobre el Camión -->
    <path d="M120 110h100v44H120z" rx="8" fill="#FFFFFF"/>
    <path d="M150 90h40v20h-40z" fill="#FFFFFF"/>
    <path d="M165 74h10v16h-10z" fill="#FF6D00"/>
    
    <!-- Ventana de Cabina -->
    <path d="M300 206h55l25 34h-80z" fill="#1E293B"/>
    
    <!-- Parachoques -->
    <rect x="390" y="270" width="30" height="30" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- Llama de Gas GLP Fuego -->
  <path d="M170 120c0 15-10 25-20 25s-20-10-20-25c0-15 20-35 20-35s20 20 20 35z" fill="#FFD600"/>

  <!-- Ruedas en Movimiento -->
  <circle cx="140" cy="330" r="44" fill="#0F172A" stroke="#FFFFFF" stroke-width="10"/>
  <circle cx="140" cy="330" r="18" fill="#FF6D00"/>

  <circle cx="340" cy="330" r="44" fill="#0F172A" stroke="#FFFFFF" stroke-width="10"/>
  <circle cx="340" cy="330" r="18" fill="#FF6D00"/>
</svg>
