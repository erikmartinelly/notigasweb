<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <!-- Valve / Top Handle -->
  <path d="M 40 18 L 60 18 L 60 25 L 40 25 Z" fill="#334155"/>
  <path d="M 45 10 L 55 10 L 55 18 L 45 18 Z" fill="#64748B"/>
  <rect x="47" y="5" width="6" height="5" rx="1" fill="#94A3B8"/>
  <ellipse cx="50" cy="5" rx="8" ry="3" fill="#E2E8F0"/>
  <!-- Handle Ring -->
  <path d="M 30 25 C 30 18, 70 18, 70 25 L 75 35 L 25 35 Z" fill="#B71C1C"/>
  <path d="M 36 27 C 36 23, 64 23, 64 27 L 66 33 L 34 33 Z" fill="#0F172A"/>
  <!-- Main Cylinder Body -->
  <rect x="20" y="35" width="60" height="85" rx="18" fill="url(#redGradient)"/>
  <!-- Center Weld Seam Ring -->
  <line x1="20" y1="75" x2="80" y2="75" stroke="#880E0E" stroke-width="3"/>
  <line x1="20" y1="76" x2="80" y2="76" stroke="#FF5252" stroke-width="1"/>
  <!-- Base Rim -->
  <path d="M 28 120 L 72 120 L 75 132 L 25 132 Z" fill="#880E0E"/>
  <ellipse cx="50" cy="132" rx="25" ry="4" fill="#520707"/>
  <!-- Metallic Highlight / Shine -->
  <path d="M 28 40 Q 25 75 28 115" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Label / Branding Text -->
  <text x="50" y="65" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GLP</text>
  <text x="50" y="95" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#FFCDD2" text-anchor="middle">10 KG</text>
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D32F2F"/>
      <stop offset="25%" stop-color="#FF1744"/>
      <stop offset="60%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
  </defs>
</svg>
