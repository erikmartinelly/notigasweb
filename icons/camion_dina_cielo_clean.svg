<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 110 420 280"  >
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="cabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#0284C7"/>
      <stop offset="75%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cargoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#0284C7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="truckShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  

  <!-- GRUPO CAMIÓN TOYOTA DINA -->
  <g filter="url(#truckShadow)">
    <!-- FURGÓN / CARROCERÍA POSTERIOR -->
    <rect x="70" y="145" width="205" height="185" rx="14" fill="url(#cargoGrad)" stroke="#94A3B8" stroke-width="3"/>
    <line x1="138" y1="148" x2="138" y2="328" stroke="#CBD5E1" stroke-width="2.5"/>
    <line x1="206" y1="148" x2="206" y2="328" stroke="#CBD5E1" stroke-width="2.5"/>
    <rect x="78" y="153" width="189" height="12" rx="3" fill="#94A3B8" opacity="0.3"/>

    <!-- LOGO NOTIGAS EN CARROCERÍA -->
    <rect x="86" y="195" width="125" height="34" rx="6" fill="#0F172A" opacity="0.85"/>
    <text x="148" y="218" font-family="'Segoe UI', Roboto, Montserrat, sans-serif" font-weight="900" font-size="16" fill="#FFD200" text-anchor="middle" letter-spacing="2">NOTIGAS</text>

    <!-- CABINA FRONTAL TOYOTA DINA -->
    <path d="M 260 140 L 370 140 Q 405 142 418 175 L 442 245 Q 446 258 446 275 L 446 332 Q 446 338 440 338 L 260 338 Z" fill="url(#cabGrad)" stroke="#0369A1" stroke-width="3"/>

    <!-- PARABRISAS INCLINADO AERODINÁMICO -->
    <path d="M 285 152 L 366 152 Q 390 154 398 176 L 418 226 Q 420 232 414 232 L 285 232 Z" fill="url(#windshieldGrad)" stroke="#0284C7" stroke-width="2.5"/>
    <path d="M 305 156 L 332 156 L 305 224 L 290 224 Z" fill="rgba(255,255,255,0.45)"/>

    <!-- VENTANA LATERAL -->
    <path d="M 285 152 L 285 232 L 270 232 L 270 152 Z" fill="#0369A1" opacity="0.95"/>

    <!-- VISERA SUPERIOR AERODINÁMICA -->
    <path d="M 255 138 L 385 138 Q 400 138 406 146 L 255 146 Z" fill="#1E293B"/>

    <!-- RETROVISOR COMERCIAL -->
    <rect x="424" y="172" width="16" height="38" rx="4" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <line x1="416" y1="184" x2="424" y2="184" stroke="#0F172A" stroke-width="3"/>

    <!-- LÍNEA DE PUERTA Y MANIJA -->
    <line x1="265" y1="248" x2="350" y2="248" stroke="#0369A1" stroke-width="2"/>
    <rect x="312" y="252" width="22" height="6" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1"/>

    <!-- INSIGNIA CON INICIALES DEL REPARTIDOR -->
    <circle cx="340" cy="286" r="30" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="340" cy="286" r="25" fill="none" stroke="#BAE6FD" stroke-width="1.5" opacity="0.7"/>
    <text x="340" y="299" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">R</text>

    <!-- PARRILLA FRONTAL TOYOTA DINA -->
    <path d="M 426 270 L 444 270 L 444 316 L 426 316 Z" fill="#0F172A"/>
    <line x1="428" y1="280" x2="442" y2="280" stroke="#64748B" stroke-width="2"/>
    <line x1="428" y1="290" x2="442" y2="290" stroke="#64748B" stroke-width="2"/>
    <line x1="428" y1="300" x2="442" y2="300" stroke="#64748B" stroke-width="2"/>
    <line x1="428" y1="310" x2="442" y2="310" stroke="#64748B" stroke-width="2"/>

    <!-- FARO DELANTERO -->
    <rect x="432" y="248" width="12" height="18" rx="3" fill="#FEF08A" stroke="#EAB308" stroke-width="1.5"/>
    <rect x="436" y="252" width="6" height="10" rx="1" fill="#FFFFFF"/>

    <!-- PARACHOQUES ROBUSTO -->
    <path d="M 260 328 L 452 328 Q 456 328 456 336 L 454 348 Q 452 352 444 352 L 260 352 Z" fill="#334155" stroke="#1E293B" stroke-width="2"/>

    <!-- RUEDAS -->
    <g>
      <circle cx="140" cy="352" r="38" fill="#0F172A" stroke="#020617" stroke-width="3"/>
      <circle cx="140" cy="352" r="24" fill="#64748B" stroke="#CBD5E1" stroke-width="3"/>
      <circle cx="140" cy="352" r="10" fill="#0F172A"/>
      <circle cx="140" cy="352" r="4" fill="#F8FAFC"/>
    </g>
    <g>
      <circle cx="378" cy="352" r="38" fill="#0F172A" stroke="#020617" stroke-width="3"/>
      <circle cx="378" cy="352" r="24" fill="#64748B" stroke="#CBD5E1" stroke-width="3"/>
      <circle cx="378" cy="352" r="10" fill="#0F172A"/>
      <circle cx="378" cy="352" r="4" fill="#F8FAFC"/>
    </g>
  </g>
</svg>