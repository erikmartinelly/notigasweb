<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <!-- Sombra de suelo para vista cenital (Dron / Uber / InDrive) -->
    <filter id="droneViewShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#090D16" flood-opacity="0.55"/>
    </filter>

    <!-- Resplandor LED frontal -->
    <filter id="ledGlowTop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradiente de Carrocería Roja Top-Down (Rojo Rubí Metalizado) -->
    <linearGradient id="redBodyTopDown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="35%" stop-color="#E11D48"/>
      <stop offset="75%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Gradiente Techo Cabina -->
    <linearGradient id="cabRoofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <!-- Gradiente Parabrisas Frontal Vista Superior (Cristal Polarizado) -->
    <linearGradient id="windshieldTopDown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="75%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Ventanillas Laterales y Luna Trasera -->
    <linearGradient id="sideGlassTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>

    <!-- Furgón de Carga Posterior (Techo Metálico con Ranuras) -->
    <linearGradient id="cargoRoofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9F1239"/>
      <stop offset="15%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#FF385C"/>
      <stop offset="85%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Espejos Retrovisores y Parachoques -->
    <linearGradient id="mirrorChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Faros LED Delanteros -->
    <linearGradient id="headlightTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Luces Traseras de Freno -->
    <linearGradient id="taillightTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
  </defs>

  <g id="droneTruckVehicle" filter="url(#droneViewShadow)">
    
    <!-- 1. RETROVISORES LATERALES (AERODINÁMICOS VISTOS DESDE ARRIBA) -->
    <!-- Espejo Izquierdo -->
    <path d="M 22 28 C 16 28 15 31 16 34 C 18 36 24 35 24 32 Z" fill="url(#mirrorChassis)"/>
    <ellipse cx="19" cy="33" rx="2.5" ry="1.2" fill="#38BDF8" opacity="0.8"/>

    <!-- Espejo Derecho -->
    <path d="M 78 28 C 84 28 85 31 84 34 C 82 36 76 35 76 32 Z" fill="url(#mirrorChassis)"/>
    <ellipse cx="81" cy="33" rx="2.5" ry="1.2" fill="#38BDF8" opacity="0.8"/>

    <!-- 2. CHASIS / SILUETA BASE DEL CAMIÓN -->
    <rect x="23" y="8" width="54" height="102" rx="10" fill="#0F172A"/>

    <!-- 3. CABINA DELANTERA (VISTA SUPERIOR CENITAL) -->
    <!-- Capó y Parachoques Frontal Curvado -->
    <path d="M 25 24 C 25 13 34 8 50 8 C 66 8 75 13 75 24 L 75 48 L 25 48 Z" fill="url(#cabRoofGrad)"/>
    
    <!-- Bisel de Luz en Borde Frontal -->
    <path d="M 30 11 C 40 8.5 60 8.5 70 11" stroke="#FFA4B6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.9"/>

    <!-- Faros Delanteros LED Esquinados con Brillo -->
    <g filter="url(#ledGlowTop)">
      <path d="M 27 12 C 30 10 34 11 35 15 L 29 16 C 27 16 26 14 27 12 Z" fill="url(#headlightTop)"/>
      <path d="M 73 12 C 70 10 66 11 65 15 L 71 16 C 73 16 74 14 73 12 Z" fill="url(#headlightTop)"/>
    </g>

    <!-- Parabrisas Delantero Panorámico (Curva y Cristal Superior) -->
    <path d="M 27 20 C 35 17 65 17 73 20 L 71 31 C 63 29 37 29 29 31 Z" fill="url(#windshieldTopDown)"/>
    <!-- Destello Blanco Reflejo en Parabrisas -->
    <path d="M 31 22 C 38 20 62 20 69 22 L 67 25 C 61 23 39 23 33 25 Z" fill="#FFFFFF" opacity="0.65"/>
    <path d="M 35 26 L 42 27 L 40 29 L 34 28 Z" fill="#FFFFFF" opacity="0.4"/>

    <!-- Ventanillas Laterales de la Cabina -->
    <path d="M 25 32 L 28 32 L 27 45 L 25 44 Z" fill="url(#sideGlassTop)"/>
    <path d="M 75 32 L 72 32 L 73 45 L 75 44 Z" fill="url(#sideGlassTop)"/>

    <!-- Techo Superior de Cabina -->
    <path d="M 29 31 C 37 29 63 29 71 31 L 72 47 C 62 46.5 38 46.5 28 47 Z" fill="url(#redBodyTopDown)"/>
    <!-- Ranuras en Techo de Cabina -->
    <line x1="42" y1="34" x2="42" y2="44" stroke="rgba(0,0,0,0.25)" stroke-width="1.2"/>
    <line x1="43" y1="34" x2="43" y2="44" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
    <line x1="57" y1="34" x2="57" y2="44" stroke="rgba(0,0,0,0.25)" stroke-width="1.2"/>
    <line x1="58" y1="34" x2="58" y2="44" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>

    <!-- 4. SEPARADOR / UNIÓN DE CABINA Y FURGÓN -->
    <rect x="25" y="47" width="50" height="2.5" fill="#0F172A"/>

    <!-- 5. FURGÓN DE CARGA TRASERO (VISTA SUPERIOR DESDE ARRIBA) -->
    <rect x="24" y="49" width="52" height="58" rx="4" fill="url(#cargoRoofGrad)"/>
    
    <!-- Bisel de Luz Perimetral del Furgón -->
    <rect x="25" y="50" width="50" height="56" rx="3" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>

    <!-- Ranuras y Costillas de Refuerzo del Techo del Furgón (Efecto Texturizado 3D) -->
    <line x1="32" y1="52" x2="32" y2="103" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
    <line x1="33" y1="52" x2="33" y2="103" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>

    <line x1="41" y1="52" x2="41" y2="103" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
    <line x1="42" y1="52" x2="42" y2="103" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>

    <line x1="58" y1="52" x2="58" y2="103" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
    <line x1="59" y1="52" x2="59" y2="103" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>

    <line x1="67" y1="52" x2="67" y2="103" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
    <line x1="68" y1="52" x2="68" y2="103" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>

    <!-- Emblema Central en el Techo (Círculo de Distribución de Gas / Llama de Energía) -->
    <circle cx="50" cy="77" r="10" fill="#0F172A" opacity="0.45"/>
    <circle cx="50" cy="77" r="8.5" fill="#1E293B" stroke="#FBBF24" stroke-width="1"/>
    <!-- Llama Dorada GLP en el Techo -->
    <path d="M 50 71 C 50 71 45.5 75 45.5 77.5 C 45.5 80 47.5 82 50 82 C 52.5 82 54.5 80 54.5 77.5 C 54.5 75 50 71 50 71 Z" fill="#FBBF24"/>
    <path d="M 50 74.5 C 50 74.5 47.5 76.5 47.5 78 C 47.5 79.5 48.5 80.5 50 80.5 C 51.5 80.5 52.5 79.5 52.5 78 C 52.5 76.5 50 74.5 50 74.5 Z" fill="#F59E0B"/>

    <!-- 6. PARACHOQUES TRASERO Y LUCES DE FRENO -->
    <rect x="26" y="106" width="48" height="3" rx="1.5" fill="#1E293B"/>
    <!-- Luz Trasera Izquierda -->
    <rect x="26" y="105" width="8" height="2.5" rx="1" fill="url(#taillightTop)"/>
    <!-- Luz Trasera Derecha -->
    <rect x="66" y="105" width="8" height="2.5" rx="1" fill="url(#taillightTop)"/>
  </g>
</svg>
