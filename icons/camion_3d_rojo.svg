<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sombra sutil y elegante en el suelo -->
    <filter id="cleanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra en el suelo -->
  <ellipse cx="64" cy="112" rx="48" ry="7" fill="#0F172A" opacity="0.22"/>

  <g id="simpleElegantTruck" filter="url(#cleanShadow)">
    <!-- 1. CHASIS Y BASE -->
    <rect x="14" y="90" width="100" height="8" rx="2" fill="#1E293B"/>

    <!-- 2. CARROCERÍA / FURGÓN TRASERO (Blanco Claro con Borde Sutil) -->
    <rect x="14" y="44" width="56" height="48" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Garrafas / Cilindros de Gas GLP en la Caja -->
    <g id="cylinders">
      <!-- Garrafa 1 -->
      <rect x="20" y="52" width="10" height="26" rx="4" fill="#FF6D00"/>
      <rect x="23" y="48" width="4" height="4" rx="1" fill="#475569"/>
      <ellipse cx="25" cy="52" rx="4" ry="1.5" fill="#FFA040"/>

      <!-- Garrafa 2 -->
      <rect x="34" y="52" width="10" height="26" rx="4" fill="#FF6D00"/>
      <rect x="37" y="48" width="4" height="4" rx="1" fill="#475569"/>
      <ellipse cx="39" cy="52" rx="4" ry="1.5" fill="#FFA040"/>

      <!-- Garrafa 3 -->
      <rect x="48" y="52" width="10" height="26" rx="4" fill="#FF6D00"/>
      <rect x="51" y="48" width="4" height="4" rx="1" fill="#475569"/>
      <ellipse cx="53" cy="52" rx="4" ry="1.5" fill="#FFA040"/>

      <!-- Reja / Baranda de Protección Metálica -->
      <line x1="14" y1="68" x2="70" y2="68" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      <line x1="14" y1="82" x2="70" y2="82" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- 3. CABINA NISSAN CONDOR (Rojo Clásico Elegante) -->
    <!-- Estructura de Cabina -->
    <path d="M 70 48 L 94 48 C 104 48 112 56 112 66 L 112 92 L 70 92 Z" fill="#E11D48"/>
    
    <!-- Deflector de Techo Suave (Estilo Nissan Condor) -->
    <path d="M 70 48 C 76 40 88 40 96 48 Z" fill="#BE123C"/>

    <!-- Parabrisas / Ventana Frontal y Lateral -->
    <path d="M 74 54 L 94 54 C 100 54 105 58 106 64 L 106 68 L 74 68 Z" fill="#38BDF8"/>
    <!-- Reflejo blanco elegante en ventana -->
    <path d="M 76 56 L 86 56 L 82 66 L 76 66 Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- Parrilla y Frente Delantero -->
    <path d="M 108 72 L 114 74 C 115 75 115 78 114 79 L 108 81 Z" fill="#1E293B"/>
    <!-- Faro Delantero Blanco Cálido -->
    <rect x="108" y="82" width="4" height="6" rx="1" fill="#FEF08A"/>

    <!-- Parachoques Frontal -->
    <rect x="106" y="89" width="10" height="6" rx="2" fill="#334155"/>

    <!-- 4. MEDALLÓN LATERAL 'R' (Elegante y Limpio) -->
    <g id="badgeR">
      <circle cx="88" cy="79" r="8.5" fill="#FFFFFF"/>
      <circle cx="88" cy="79" r="7.5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.2"/>
      <text x="88" y="83" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-weight="900" font-size="10" fill="#E11D48" text-anchor="middle">R</text>
    </g>

    <!-- Manilla de Puerta -->
    <rect x="74" y="76" width="4" height="1.5" rx="0.75" fill="#4C0519"/>

    <!-- 5. RUEDAS CLÁSICAS LIMPIAS -->
    <!-- Rueda Delantera -->
    <circle cx="94" cy="98" r="12" fill="#0F172A"/>
    <circle cx="94" cy="98" r="6" fill="#94A3B8"/>
    <circle cx="94" cy="98" r="2.5" fill="#0F172A"/>

    <!-- Rueda Trasera -->
    <circle cx="34" cy="98" r="12" fill="#0F172A"/>
    <circle cx="34" cy="98" r="6" fill="#94A3B8"/>
    <circle cx="34" cy="98" r="2.5" fill="#0F172A"/>
  </g>
</svg>
