<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="truckShadow3D" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#090D16" flood-opacity="0.6"/>
    </filter>
    
    <filter id="headlightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradientes Carrocería 3D -->
    <!-- Techo Superior (Iluminado desde arriba) -->
    <linearGradient id="roofGrad3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B8B"/>
      <stop offset="40%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Lateral Principal (Vista de costado 3/4) -->
    <linearGradient id="sideBodyGrad3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2E56"/>
      <stop offset="25%" stop-color="#E11D48"/>
      <stop offset="70%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Frente / Trompa (Ángulo sombreado) -->
    <linearGradient id="frontBodyGrad3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE123C"/>
      <stop offset="60%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#700C28"/>
    </linearGradient>

    <!-- Parabrisas 3D Tintado -->
    <linearGradient id="windshieldGrad3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="75%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Ventanilla Lateral 3D -->
    <linearGradient id="sideWindowGrad3D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>

    <!-- Ruedas y Llantas 3D -->
    <linearGradient id="tireGrad3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="50%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="rimGrad3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Sombra Proyectada en el Piso -->
  <ellipse cx="62" cy="102" rx="50" ry="14" fill="#090D16" opacity="0.4"/>

  <g id="truck3DAngled" filter="url(#truckShadow3D)">
    <!-- 1. RUEDA TRASERA IZQUIERDA -->
    <ellipse cx="36" cy="90" rx="8" ry="12" fill="url(#tireGrad3D)"/>

    <!-- 2. CHASIS INFERIOR Y BAJO MOTOR -->
    <path d="M 14 79 L 24 88 L 96 95 L 110 88 L 102 78 Z" fill="#0F172A"/>

    <!-- 3. FURGÓN DE CARGA POSTERIOR (Costado y Techo) -->
    <!-- Techo del Furgón -->
    <path d="M 16 38 L 44 23 L 78 30 L 50 45 Z" fill="url(#roofGrad3D)"/>
    <!-- Líneas de Brillo / Ranuras en Techo Furgón -->
    <line x1="27" y1="32" x2="57" y2="39" stroke="rgba(255,255,255,0.45)" stroke-width="1" stroke-linecap="round"/>
    <line x1="37" y1="27" x2="67" y2="34" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>

    <!-- Lateral Principal del Furgón (Vista de costado amplia) -->
    <path d="M 16 38 L 50 45 L 50 82 L 16 75 Z" fill="url(#sideBodyGrad3D)"/>
    
    <!-- Bisel Superior del Furgón -->
    <path d="M 16 38 L 50 45" stroke="#FFA4B6" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

    <!-- Ranura Vertical / Moldura del Furgón -->
    <line x1="33" y1="41" x2="33" y2="78" stroke="rgba(0,0,0,0.25)" stroke-width="1.2"/>
    <line x1="34" y1="41" x2="34" y2="78" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>

    <!-- Emblema NOTIGAS / Llama de GLP en el lateral del Furgón -->
    <circle cx="33" cy="58" r="9" fill="#0F172A" opacity="0.35"/>
    <circle cx="33" cy="58" r="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1"/>
    <!-- Llama Amarilla / Naranja -->
    <path d="M 33 52 C 33 52 29 56 29 58.5 C 29 60.8 30.8 62.5 33 62.5 C 35.2 62.5 37 60.8 37 58.5 C 37 56 33 52 33 52 Z" fill="#FBBF24"/>
    <path d="M 33 55.5 C 33 55.5 31 57.5 31 59 C 31 60.2 31.8 61 33 61 C 34.2 61 35 60.2 35 59 C 35 57.5 33 55.5 33 55.5 Z" fill="#EA580C"/>

    <!-- Franja Reflectiva Plateada Lateral -->
    <path d="M 16 70 L 50 77" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 4. CABINA DELANTERA (3D de Costado y Frente) -->
    <!-- Techo de Cabina -->
    <path d="M 50 45 L 78 30 L 86 36 L 63 51 Z" fill="url(#roofGrad3D)"/>
    
    <!-- Parabrisas Delantero Inclinado (Cristal Panorámico) -->
    <path d="M 86 36 L 110 59 L 98 67 L 63 51 Z" fill="url(#windshieldGrad3D)"/>
    <!-- Destello Blanco Reflejo en Parabrisas -->
    <path d="M 88 38 L 108 58 L 103 61 L 83 41 Z" fill="#FFFFFF" opacity="0.55"/>

    <!-- Ventanilla Lateral de la Cabina -->
    <path d="M 52 48 L 62 52 L 62 65 L 52 61 Z" fill="url(#sideWindowGrad3D)"/>
    <!-- Reflejo Ventanilla Lateral -->
    <path d="M 54 49 L 60 52 L 58 58 L 54 55 Z" fill="#FFFFFF" opacity="0.4"/>

    <!-- Puerta / Costado Lateral de la Cabina -->
    <path d="M 50 45 L 63 51 L 63 85 L 50 82 Z" fill="url(#sideBodyGrad3D)"/>
    <!-- Manilla de Puerta -->
    <rect x="54" y="66" width="4" height="1.5" rx="0.7" fill="#1E293B"/>

    <!-- Espejo Retrovisor 3D -->
    <path d="M 63 52 L 67 51 L 67 58 L 63 57 Z" fill="#0F172A"/>
    <ellipse cx="65" cy="54.5" rx="1.2" ry="2.5" fill="#38BDF8" opacity="0.8"/>

    <!-- Capó Frontal / Parrilla Delantera -->
    <path d="M 63 51 L 98 67 L 98 86 L 63 85 Z" fill="url(#frontBodyGrad3D)"/>
    
    <!-- Frente / Trompa Frontal con Rejilla y Faros -->
    <path d="M 98 67 L 114 74 L 114 90 L 98 86 Z" fill="url(#frontBodyGrad3D)"/>
    
    <!-- Rejilla Radiador Frontal -->
    <path d="M 103 76 L 112 80 L 112 86 L 103 82 Z" fill="#0F172A"/>
    <line x1="105" y1="78" x2="110" y2="80" stroke="#475569" stroke-width="1"/>
    <line x1="105" y1="81" x2="110" y2="83" stroke="#475569" stroke-width="1"/>

    <!-- Faros Delanteros LED con Resplandor Neón -->
    <g filter="url(#headlightGlow)">
      <path d="M 99 71 L 103 72.5 L 103 77 L 99 75.5 Z" fill="#E0F2FE"/>
      <path d="M 111 76 L 114 77.5 L 114 82 L 111 80.5 Z" fill="#38BDF8"/>
    </g>

    <!-- Parachoques Frontal Metálico -->
    <path d="M 97 85 L 115 89 L 115 94 L 97 90 Z" fill="#334155"/>

    <!-- 5. RUEDAS 3D EN EL LATERAL VISIBLE -->
    <!-- Rueda Delantera -->
    <g>
      <ellipse cx="78" cy="87" rx="8.5" ry="13" fill="url(#tireGrad3D)"/>
      <ellipse cx="78" cy="87" rx="5.5" ry="8.5" fill="url(#rimGrad3D)"/>
      <ellipse cx="78" cy="87" rx="2.5" ry="4" fill="#0F172A"/>
    </g>

    <!-- Rueda Trasera Principal -->
    <g>
      <ellipse cx="28" cy="80" rx="8.5" ry="13" fill="url(#tireGrad3D)"/>
      <ellipse cx="28" cy="80" rx="5.5" ry="8.5" fill="url(#rimGrad3D)"/>
      <ellipse cx="28" cy="80" rx="2.5" ry="4" fill="#0F172A"/>
    </g>

    <!-- Guardabarros 3D -->
    <path d="M 20 78 C 20 72 36 72 36 78" stroke="#881337" stroke-width="2.5" fill="none"/>
    <path d="M 70 85 C 70 79 86 79 86 85" stroke="#700C28" stroke-width="2.5" fill="none"/>
  </g>
</svg>
