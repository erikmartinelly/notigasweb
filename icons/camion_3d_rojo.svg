<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Sombra suave en el suelo con 20% de perspectiva -->
    <filter id="condorShadow20" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.05   0 0 0 0 0.08   0 0 0 0 0.15   0 0 0 0.45 0"/>
    </filter>

    <!-- Resplandor faros LED -->
    <filter id="condorLedGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>

    <!-- Gradientes Rojo Nissan Condor -->
    <!-- Techo y Deflector Superior (Luz superior) -->
    <linearGradient id="condorRedTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B56"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <!-- Lateral Cabina y Toldo Rojo (Vista lateral con 20% 3D) -->
    <linearGradient id="condorRedSideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2E56"/>
      <stop offset="25%" stop-color="#E11D48"/>
      <stop offset="70%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Toldo Rojo Posterior (Lona / Carrocería cerrada sin productos) -->
    <linearGradient id="condorToldoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="40%" stop-color="#BE123C"/>
      <stop offset="85%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#700C28"/>
    </linearGradient>
    <linearGradient id="condorToldoTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Frente / Trompa Delantera (Ángulo 3D sombreado suave) -->
    <linearGradient id="condorRedFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE123C"/>
      <stop offset="50%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>

    <!-- Cristales y Parabrisas Tintados -->
    <linearGradient id="condorGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Neumáticos y Llantas -->
    <linearGradient id="condorTireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="condorRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- 1. SOMBRA BASE EN SUELO (Perspectiva 20%) -->
  <ellipse cx="78" cy="136" rx="64" ry="14" fill="#020617" filter="url(#condorShadow20)"/>

  <!-- 2. CHASIS INFERIOR Y TRANSMISIÓN -->
  <path d="M 16 106 L 28 118 L 128 126 L 144 116 L 134 104 Z" fill="#0F172A"/>

  <!-- 3. TOLDO ROJO TRASERO CERRADO (TODO ROJO, SIN PRODUCTOS VISIBLES) -->
  <!-- Techo del Toldo Rojo con curvatura suave de lona -->
  <path d="M 18 46 C 24 43 50 28 54 28 L 96 36 L 60 56 Z" fill="url(#condorToldoTopGrad)"/>
  <!-- Línea de brillo sutil en el lomo del toldo -->
  <line x1="26" y1="41" x2="68" y2="49" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Lateral Completo del Toldo Rojo -->
  <path d="M 18 46 L 60 56 L 60 108 L 18 98 Z" fill="url(#condorToldoGrad)"/>
  <path d="M 18 46 L 60 56" stroke="#FF8599" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Costuras y Pliegues de la Lona del Toldo (Elegante y Limpio) -->
  <line x1="32" y1="49" x2="32" y2="101" stroke="rgba(0,0,0,0.2)" stroke-width="1.2"/>
  <line x1="33" y1="49" x2="33" y2="101" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <line x1="46" y1="52" x2="46" y2="104" stroke="rgba(0,0,0,0.2)" stroke-width="1.2"/>
  <line x1="47" y1="52" x2="47" y2="104" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>

  <!-- Franja Reflectiva Inferior en Toldo -->
  <path d="M 18 92 L 60 102" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>

  <!-- 4. CABINA NISSAN CONDOR (TODO ROJO, COE, 20% PERSPECTIVA 3D) -->
  <!-- Alerón Deflector Superior Nissan Condor (Rojo) -->
  <path d="M 58 50 C 64 40 76 33 94 32 L 106 40 C 88 42 76 48 76 58 Z" fill="url(#condorRedTopGrad)"/>
  <path d="M 58 50 L 94 32 L 106 40 L 76 58 Z" fill="#FF4D6D" opacity="0.35"/>

  <!-- Techo de Cabina -->
  <path d="M 60 56 L 96 40 L 110 48 L 78 65 Z" fill="url(#condorRedTopGrad)"/>

  <!-- Parabrisas Delantero Panorámico 3D -->
  <path d="M 110 48 L 140 76 L 124 87 L 78 65 Z" fill="url(#condorGlassGrad)"/>
  <!-- Reflejo nítido blanco en parabrisas -->
  <path d="M 112 51 L 137 75 L 131 79 L 105 55 Z" fill="#FFFFFF" opacity="0.55"/>
  <!-- Limpiaparabrisas -->
  <line x1="92" y1="69" x2="106" y2="58" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="114" y1="79" x2="128" y2="68" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Ventanilla Lateral del Conductor -->
  <path d="M 63 60 L 76 65 L 76 82 L 63 77 Z" fill="url(#condorGlassGrad)"/>
  <path d="M 65 62 L 73 65 L 71 73 L 65 69 Z" fill="#FFFFFF" opacity="0.45"/>

  <!-- PUERTA LATERAL DE CABINA ROJA -->
  <path d="M 60 56 L 78 65 L 78 112 L 60 106 Z" fill="url(#condorRedSideGrad)"/>
  
  <!-- MEDALLÓN CIRCULAR BLANCO CON LA LETRA 'R' EN LA PUERTA -->
  <g id="badgeCondorR">
    <circle cx="69" cy="89" r="9.5" fill="#0F172A" opacity="0.3"/>
    <circle cx="69" cy="88" r="8.5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.2"/>
    <!-- Letra R en Rojo Brillante Notigas -->
    <text x="69" y="92.5" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="11.5" fill="#E11D48" text-anchor="middle">R</text>
  </g>

  <!-- Manilla de Puerta -->
  <rect x="64" y="84" width="4" height="1.6" rx="0.8" fill="#4C0519"/>

  <!-- Espejo Retrovisor 3D -->
  <path d="M 78 66 L 84 65 L 84 74 L 78 73 Z" fill="#0F172A"/>
  <ellipse cx="81.5" cy="69.5" rx="1.5" ry="3" fill="#38BDF8"/>

  <!-- PARTE FRONTAL / CAPÓ / PARRILLA NISSAN CONDOR (ROJO) -->
  <!-- Lateral frontal -->
  <path d="M 78 65 L 124 87 L 124 113 L 78 112 Z" fill="url(#condorRedFrontGrad)"/>
  <!-- Frente delantero -->
  <path d="M 124 87 L 146 96 L 146 117 L 124 113 Z" fill="url(#condorRedFrontGrad)"/>

  <!-- PARRILLA CROMADA CONDOR -->
  <path d="M 130 99 L 143 104 L 143 114 L 130 110 Z" fill="#0F172A"/>
  <line x1="132" y1="101.5" x2="141" y2="105" stroke="#F1F5F9" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="132" y1="105.5" x2="141" y2="109" stroke="#F1F5F9" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="132" y1="109.5" x2="141" y2="113" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="round"/>
  
  <!-- Emblema Nissan Central -->
  <circle cx="136.5" cy="105" r="2.2" fill="#E11D48" stroke="#FFFFFF" stroke-width="0.8"/>

  <!-- FAROS DELANTEROS LED CRISTALINOS -->
  <g filter="url(#condorLedGlow)">
    <path d="M 125 93 L 130 95 L 130 101 L 125 99 Z" fill="#FFFFFF"/>
    <path d="M 142 100 L 146 102 L 146 108 L 142 106 Z" fill="#FEF08A"/>
  </g>

  <!-- Parachoques Frontal Metálico Reforzado -->
  <path d="M 123 112 L 147 117 L 147 123 L 123 118 Z" fill="#1E293B"/>

  <!-- 5. RUEDAS 3D NISSAN CONDOR -->
  <!-- Rueda Delantera -->
  <g id="frontWheelCondor">
    <ellipse cx="100" cy="116" rx="11" ry="16" fill="url(#condorTireGrad)"/>
    <ellipse cx="100" cy="116" rx="7" ry="11" fill="url(#condorRimGrad)"/>
    <ellipse cx="100" cy="116" rx="3.5" ry="5.5" fill="#0F172A"/>
    <!-- Tuercas -->
    <circle cx="100" cy="113" r="0.8" fill="#F8FAFC"/>
    <circle cx="102" cy="116" r="0.8" fill="#F8FAFC"/>
    <circle cx="98" cy="116" r="0.8" fill="#F8FAFC"/>
    <circle cx="100" cy="119" r="0.8" fill="#F8FAFC"/>
  </g>

  <!-- Rueda Trasera (Doble Rodado) -->
  <g id="rearWheelCondor">
    <ellipse cx="34" cy="106" rx="11" ry="16" fill="url(#condorTireGrad)"/>
    <ellipse cx="34" cy="106" rx="7" ry="11" fill="url(#condorRimGrad)"/>
    <ellipse cx="34" cy="106" rx="3.5" ry="5.5" fill="#0F172A"/>
    <circle cx="34" cy="103" r="0.8" fill="#F8FAFC"/>
    <circle cx="36" cy="106" r="0.8" fill="#F8FAFC"/>
    <circle cx="32" cy="106" r="0.8" fill="#F8FAFC"/>
    <circle cx="34" cy="109" r="0.8" fill="#F8FAFC"/>
  </g>

  <!-- Guardabarros 3D en Rojo Oscuro -->
  <path d="M 24 104 C 24 96 44 96 44 104" stroke="#4C0519" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 90 114 C 90 106 110 106 110 114" stroke="#4C0519" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>
