<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" width="120" height="60">
  <defs>
    <!-- Gradientes para un look moderno y serio -->
    <linearGradient id="redCab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="glassWindow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="wheelTire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#424242"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>
    <linearGradient id="chassisMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9e9e9e"/>
      <stop offset="100%" stop-color="#616161"/>
    </linearGradient>
    <linearGradient id="gasCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="50%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    
    <g id="cylinder">
      <rect x="0" y="4" width="8" height="14" rx="2" fill="url(#gasCylinder)"/>
      <path d="M 2 4 Q 4 1 6 4" fill="none" stroke="#e53935" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- Chasis (Bed and undercarriage) -->
  <rect x="10" y="40" width="75" height="4" fill="url(#chassisMetal)" rx="1"/>
  <rect x="15" y="38" width="65" height="2" fill="#757575"/>

  <!-- Estructura de la carrocería trasera (Cage) -->
  <path d="M 12 18 L 12 40 M 35 18 L 35 40 M 58 18 L 58 40 M 80 18 L 80 40" stroke="#757575" stroke-width="1.5"/>
  <path d="M 12 18 L 80 18 M 12 25 L 80 25 M 12 32 L 80 32" stroke="#757575" stroke-width="1.5"/>

  <!-- Cilindros de Gas (Garrafas) en la parte trasera -->
  <!-- Fila inferior -->
  <use href="#cylinder" x="14" y="22"/>
  <use href="#cylinder" x="24" y="22"/>
  <use href="#cylinder" x="34" y="22"/>
  <use href="#cylinder" x="44" y="22"/>
  <use href="#cylinder" x="54" y="22"/>
  <use href="#cylinder" x="64" y="22"/>
  <use href="#cylinder" x="74" y="22"/>
  <!-- Fila superior -->
  <use href="#cylinder" x="14" y="8"/>
  <use href="#cylinder" x="24" y="8"/>
  <use href="#cylinder" x="34" y="8"/>
  <use href="#cylinder" x="44" y="8"/>
  <use href="#cylinder" x="54" y="8"/>
  <use href="#cylinder" x="64" y="8"/>
  <use href="#cylinder" x="74" y="8"/>

  <!-- Cabina del Nissan Condor (Modern Truck Cab) -->
  <path d="M 80 15 L 102 15 C 105 15, 108 17, 110 22 L 115 35 C 115 38, 116 42, 116 45 L 116 46 L 80 46 Z" fill="url(#redCab)"/>
  
  <!-- Ventana -->
  <path d="M 82 17 L 100 17 C 102 17, 104 18, 105 21 L 109 31 C 109 33, 109 34, 107 34 L 82 34 Z" fill="url(#glassWindow)"/>
  
  <!-- Detalles de la cabina -->
  <rect x="82" y="36" width="10" height="2" fill="#d32f2f" rx="1"/> <!-- Handle -->
  <path d="M 112 37 L 115 37 L 115 40 L 112 40 Z" fill="#ffeb3b" opacity="0.8"/> <!-- Headlight -->
  <path d="M 80 15 L 80 46" stroke="#212121" stroke-width="1.5" opacity="0.5"/> <!-- Door line -->

  <!-- Ruedas -->
  <!-- Rueda Trasera -->
  <circle cx="28" cy="46" r="8" fill="url(#wheelTire)"/>
  <circle cx="28" cy="46" r="4" fill="#9e9e9e"/>
  <circle cx="28" cy="46" r="2" fill="#424242"/>
  
  <!-- Rueda Delantera -->
  <circle cx="98" cy="46" r="8" fill="url(#wheelTire)"/>
  <circle cx="98" cy="46" r="4" fill="#9e9e9e"/>
  <circle cx="98" cy="46" r="2" fill="#424242"/>

</svg>
