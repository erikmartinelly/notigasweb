<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="redTruckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#D32F2F"/>
    </linearGradient>
    <linearGradient id="cabinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#80DEEA"/>
    </linearGradient>
    <filter id="truckShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <g filter="url(#truckShadow)">
    <!-- Cuerpo del Contenedor/Caja del Camión -->
    <rect x="4" y="16" width="36" height="28" rx="4" fill="url(#redTruckGrad)" stroke="#B71C1C" stroke-width="1.5"/>
    <path d="M 8 16 L 8 44 M 16 16 L 16 44 M 24 16 L 24 44 M 32 16 L 32 44" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="2 2"/>
    
    <!-- Cabina del Camión -->
    <path d="M 40 24 H 52 C 55 24 58 27 58 30 V 44 H 40 Z" fill="url(#cabinGrad)" stroke="#B71C1C" stroke-width="1.5"/>
    
    <!-- Parabrisas / Ventana -->
    <path d="M 43 27 H 50 C 52 27 53.5 28.5 53 30.5 L 51.5 35 H 43 Z" fill="url(#windowGrad)" stroke="#00838F" stroke-width="1"/>
    
    <!-- Parachoques Frontal y Faro -->
    <rect x="56" y="38" width="4" height="6" rx="1.5" fill="#FFD600"/>
    <rect x="57" y="42" width="3" height="3" rx="1" fill="#ECEFF1"/>
    
    <!-- Ruedas -->
    <circle cx="14" cy="46" r="7" fill="#212121" stroke="#424242" stroke-width="1.5"/>
    <circle cx="14" cy="46" r="3" fill="#B0BEC5"/>
    
    <circle cx="46" cy="46" r="7" fill="#212121" stroke="#424242" stroke-width="1.5"/>
    <circle cx="46" cy="46" r="3" fill="#B0BEC5"/>
    
    <!-- Detalle Garrafa de Gas en la Caja -->
    <path d="M 20 23 C 20 21 22 20 24 20 C 26 20 28 21 28 23 V 37 C 28 39 26 40 24 40 C 22 40 20 39 20 37 Z" fill="#FFEA00" opacity="0.9"/>
  </g>
</svg>
