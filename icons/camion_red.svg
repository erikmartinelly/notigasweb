<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente de carrocería principal: Rojo profesional profundo -->
    <linearGradient id="modernRedBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="60%" stop-color="#D5001C"/>
      <stop offset="100%" stop-color="#990012"/>
    </linearGradient>

    <!-- Gradiente de cabina frontal -->
    <linearGradient id="cabinModernGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5266"/>
      <stop offset="100%" stop-color="#B70018"/>
    </linearGradient>

    <!-- Gradiente de parabrisas tintado moderno -->
    <linearGradient id="windshieldGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Gradiente de chasis metálico -->
    <linearGradient id="metallicChassis" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Llantas de aleación deportiva -->
    <linearGradient id="wheelRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Sombra suave de elevación -->
    <filter id="softElevation" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#softElevation)">
    <!-- Chasis inferior -->
    <rect x="8" y="42" width="46" height="5" rx="2" fill="url(#metallicChassis)"/>

    <!-- Furgón de Carga Principal (Aerodinámico y minimalista) -->
    <path d="M 6 20 C 6 17.5 7.5 16 10 16 L 39 16 C 40 16 41 17 41 18 L 41 42 L 6 42 Z" fill="url(#modernRedBody)"/>
    
    <!-- Línea decorativa plateada de velocidad / flota moderna -->
    <path d="M 6 34 L 38 34" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 12 24 L 20 24" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>

    <!-- Icono minimalista de energía / gas en el lateral del furgón -->
    <circle cx="24" cy="25" r="5.5" fill="rgba(0,0,0,0.2)"/>
    <path d="M 24 21.5 C 24 21.5 21.5 24 21.5 25.8 C 21.5 27.2 22.6 28.2 24 28.2 C 25.4 28.2 26.5 27.2 26.5 25.8 C 26.5 24 24 21.5 24 21.5 Z" fill="#FACC15"/>

    <!-- Cabina Frontal Moderna y Agresiva -->
    <path d="M 41 22 L 49 22 C 52 22 55 25 56.5 28.5 L 59 34.5 C 59.7 36 59.7 38 59 39.5 L 58 42 L 41 42 Z" fill="url(#cabinModernGrad)"/>

    <!-- Parabrisas / Ventana lateral panorámica -->
    <path d="M 43.5 24.5 L 48.5 24.5 C 50.8 24.5 53 26.5 54 29 L 55.8 33.5 L 43.5 33.5 Z" fill="url(#windshieldGlass)"/>
    
    <!-- Reflejo blanco en el cristal -->
    <path d="M 45 25.5 L 49 25.5 C 50.5 25.5 51.8 26.8 52.5 28.2 L 53.5 30.5 L 49 30.5 Z" fill="rgba(255,255,255,0.4)"/>

    <!-- Faro LED Frontal Brillante -->
    <path d="M 57.5 36.5 L 59.5 37 C 60 37.3 60 38.7 59.5 39 L 57 39.5 Z" fill="#00E5FF"/>
    
    <!-- Parachoques Delantero -->
    <rect x="56" y="40" width="3.5" height="2.5" rx="1" fill="#475569"/>

    <!-- Rueda Trasera 1 -->
    <circle cx="16" cy="44" r="6" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <circle cx="16" cy="44" r="3.2" fill="url(#wheelRim)"/>
    <circle cx="16" cy="44" r="1.2" fill="#09090B"/>

    <!-- Rueda Delantera -->
    <circle cx="49" cy="44" r="6" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <circle cx="49" cy="44" r="3.2" fill="url(#wheelRim)"/>
    <circle cx="49" cy="44" r="1.2" fill="#09090B"/>
  </g>
</svg>
