<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NOTIGAS - camion de reciclaje">
  <defs>
    <!-- Fondo blanco. Antes era un verde oscuro, lo que obligaba a pintar el
         camion en tonos claros; sobre blanco la carroceria lleva contorno
         propio para que no se funda con el lienzo. -->
    <linearGradient id="bgRecicla" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="cajaRecicla" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bgRecicla)"/>

  <!-- Contorno verde de marca: sobre fondo blanco sostiene la silueta y sigue
       delimitando el icono en las pestañas que usan tema oscuro. -->
  <rect width="500" height="500" x="6" y="6" rx="98" fill="none" stroke="#15803D" stroke-width="7"/>

  <!-- Camioncito: caja de carga -->
  <path d="M84 176 h214 a20 20 0 0 1 20 20 v116 H84 Z" fill="url(#cajaRecicla)" stroke="#047857" stroke-width="6" stroke-linejoin="round"/>
  <!-- Camioncito: cabina -->
  <path d="M318 232 h58 l52 56 v24 h-110 Z" fill="#D1FAE5" stroke="#047857" stroke-width="6" stroke-linejoin="round"/>
  <!-- Camioncito: parabrisas -->
  <path d="M340 250 h34 l30 34 h-64 Z" fill="#047857"/>
  <!-- Camioncito: chasis -->
  <rect x="72" y="312" width="376" height="24" rx="12" fill="#065F46"/>

  <!-- Ruedas -->
  <circle cx="152" cy="352" r="42" fill="#022C22"/>
  <circle cx="152" cy="352" r="18" fill="#E2E8F0"/>
  <circle cx="366" cy="352" r="42" fill="#022C22"/>
  <circle cx="366" cy="352" r="18" fill="#E2E8F0"/>

  <!-- Simbolo de reciclaje: tres flechas en triangulo. El verde claro se
       oscurece porque sobre blanco perdia contraste. -->
  <g transform="translate(205 242) scale(1.5)">
    <path d="M-11 -46 L11 -46 L11 -20 L27 -20 L0 12 L-27 -20 L-11 -20 Z" fill="#15803D" transform="rotate(0)"/>
    <path d="M-11 -46 L11 -46 L11 -20 L27 -20 L0 12 L-27 -20 L-11 -20 Z" fill="#166534" transform="rotate(120)"/>
    <path d="M-11 -46 L11 -46 L11 -20 L27 -20 L0 12 L-27 -20 L-11 -20 Z" fill="#22C55E" transform="rotate(240)"/>
  </g>

  <!-- Insignia con la letra "R" de Recolector en la caja -->
  <circle cx="120" cy="248" r="30" fill="#FFFFFF" stroke="#15803D" stroke-width="6"/>
  <text x="120" y="261" font-family="'Segoe UI', Roboto, 'Arial Black', sans-serif"
        font-weight="900" font-size="34" fill="#15803D" text-anchor="middle">R</text>
</svg>
